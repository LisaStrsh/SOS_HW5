name: movie-analytics
x-app: &app
  build: .
  image: movie-analytics-app:local
  restart: unless-stopped
  environment: &app-env
    KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    SCHEMA_REGISTRY_URL: http://schema-registry:8081
    CLICKHOUSE_URL: http://clickhouse:8123
    CLICKHOUSE_USER: cinema
    CLICKHOUSE_PASSWORD: cinema
    PG_DSN: postgresql://cinema:cinema@postgres:5432/cinema
    S3_ENDPOINT_URL: http://minio:9000
    AWS_ACCESS_KEY_ID: minioadmin
    AWS_SECRET_ACCESS_KEY: cinema-minio-admin-2026
    S3_BUCKET: movie-analytics
x-kafka-env: &kafka-env
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  KAFKA_DEFAULT_REPLICATION_FACTOR: 2
  KAFKA_MIN_INSYNC_REPLICAS: 1
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
  KAFKA_LOG_DIRS: /var/lib/kafka/data/logs
services:
  kafka-1:
    image: confluentinc/cp-kafka:7.7.1
    restart: unless-stopped
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
    volumes: [kafka-1-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, 'kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 30s
  kafka-2:
    image: confluentinc/cp-kafka:7.7.1
    restart: unless-stopped
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
    volumes: [kafka-2-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, 'kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 30s
  kafka-3:
    image: confluentinc/cp-kafka:7.7.1
    restart: unless-stopped
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
    volumes: [kafka-3-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, 'kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 30s
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    restart: unless-stopped
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 2
    ports: ['127.0.0.1:8081:8081']
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8081/subjects >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 24
  clickhouse:
    image: clickhouse/clickhouse-server:24.8.14.39
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: cinema
      CLICKHOUSE_USER: cinema
      CLICKHOUSE_PASSWORD: cinema
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ['127.0.0.1:8123:8123']
    volumes: [clickhouse-data:/var/lib/clickhouse]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: [CMD-SHELL, 'clickhouse-client --user cinema --password cinema --query "SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 24
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U cinema -d cinema']
      interval: 5s
      timeout: 5s
      retries: 24
  minio:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: cinema-minio-admin-2026
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: [minio-data:/data]
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:9000/minio/health/live >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 24
  init:
    <<: *app
    restart: on-failure
    command: python -m app.bootstrap
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
      schema-registry: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'test -f /tmp/initialized']
      interval: 10s
      timeout: 3s
      retries: 24
  producer:
    <<: *app
    environment:
      <<: *app-env
      GENERATE_EVENTS: ${GENERATE_EVENTS:-true}
      DEMO_SEED: ${DEMO_SEED:-true}
      GENERATOR_INTERVAL_SECONDS: ${GENERATOR_INTERVAL_SECONDS:-5}
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=8)"]
      interval: 15s
      timeout: 10s
      retries: 12
  aggregation:
    <<: *app
    command: uvicorn app.aggregation:app --host 0.0.0.0 --port 8001
    environment:
      <<: *app-env
      AGGREGATION_INTERVAL_SECONDS: ${AGGREGATION_INTERVAL_SECONDS:-60}
      RECALCULATE_DAYS: ${RECALCULATE_DAYS:-9}
    ports: ['127.0.0.1:8001:8001']
    depends_on:
      init: {condition: service_completed_successfully}
      minio: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=8)"]
      interval: 15s
      timeout: 10s
      retries: 12
  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: cinema-admin
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource 4.5.1
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cinema.json
    ports: ['127.0.0.1:3000:3000']
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  tests:
    <<: *app
    restart: 'no'
    profiles: [test]
    command: python -m pytest -q tests
    depends_on:
      producer: {condition: service_healthy}
      aggregation: {condition: service_healthy}
      grafana: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import requests; requests.get('http://producer:8000/health', timeout=8).raise_for_status()"]
      interval: 15s
      timeout: 10s
      retries: 5
volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  clickhouse-data:
  postgres-data:
  minio-data:
  grafana-data:
